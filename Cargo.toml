[workspace]
members = [
    "moba_shared",
    "moba_server",
    "moba_client",
]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
bevy_rapier3d = { version = "0.37", default-features = false }
renet = "1.0"
renet_netcode = "1.0"
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
bincode = "1.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3